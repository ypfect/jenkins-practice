services:
  jenkins:
    build: .
    image: jenkins-local:latest
    container_name: jenkins-local
    restart: unless-stopped
    group_add:
      - "991"
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Djava.awt.headless=true -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
      HTTP_PROXY: "http://host.docker.internal:7890"
      HTTPS_PROXY: "http://host.docker.internal:7890"
      NO_PROXY: "localhost,127.0.0.1,jenkins-local,host.docker.internal,registry"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_home/casc_configs:ro
      - ./maven/settings.xml:/opt/maven-settings.xml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - artifacts:/artifacts

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry

  # 对标公司构建 Pod 内的 apps-build-pgv14：构建期建临时库灌数/出 dump，部署期承载目标环境库
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "123"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jenkins_home:
  registry_data:
  artifacts:
  postgres_data:
